name: Downgrade

on:
    pull_request:
        paths-ignore:
            - "LICENSE.md"
            - "README.md"
            - ".github/workflows/CompatHelper.yml"
            - ".github/workflows/TagBot.yml"
            - "docs/**"
    workflow_dispatch:

# Cancel redundant CI tests automatically
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    downgrade_test:
        name: Downgrade ${{ matrix.os }} on ${{ matrix.julia-version }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                julia-version: ["1.10", "1.11", "1.12"]
                os: [ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-downgrade-compat@v2
              with:
                  skip: LinearAlgebra, Random, Statistics, SparseArrays, Test, Enzyme, EnzymeCore, LuxCore
                  projects: .
                  mode: deps
            - uses: julia-actions/julia-buildpkg@v1
              env:
                  PYTHON: ""
            # This job exists to test a specific dependency resolution, so record what
            # it actually resolved — without it a downgrade failure is undiagnosable.
            - name: Show resolved manifest
              run: julia --project=. -e 'import Pkg; Pkg.status(; mode = Pkg.PKGMODE_MANIFEST)'
            - uses: julia-actions/julia-runtest@v1
